<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<section>
    <nav>
        <div class="logo">
            <p>Vaccination.ng</p>
            <div class="logo-line"></div>
        </div>

        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-button">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </label>

        <div class="navbar">
            <input type="radio" name="nav" id="home" checked>
            <label for="home">Home</label>
            <input type="radio" name="nav" id="about">
            <label for="about">About</label>
            <input type="radio" name="nav" id="services">
            <label for="services">Services</label>
            <input type="radio" name="nav" id="contact">
            <label for="contact">Contact</label>
        </div>

        <button id="button-status">Check Status</button>
    </nav>

    <div class="block-vaccine">
        <div class="block-get-vaccine">
            <p class="fs-medium c-blue bold">Get Vaccinated. Boost your Immune System</p>
            <div>
                <p class="fs-big c-white extra-bold">COVID-19 Vaccination Got Easier With,</p>
                <p class="fs-big c-blue extra-bold">Vaccination.ng</p>
            </div>
            <p class="fs-medium c-white bold">Vaccination.ng will help you find the nearest centre for vaccination, in
                all
                36 states in Nigeria.</p>
            <div class="flex-row">
                <button id="button-get-vaccine" class="fs-medium c-white bold">Get Vaccine</button>
                <button id="button-help" class="fs-medium c-white bold">Help Center</button>
            </div>
        </div>

        <div class="image-container">
            <div class="main-wrapper">
                <img src="images/Doctor-small.png" alt="" class="left-img">
                <img src="images/Vaccine.png" alt="" class="main-img">
                <img src="images/Virus-small.png" alt="" class="right-img">
            </div>
            <div class="bottom-block-img">
                <div class="employees-flex">
                    <img src="images/Face-1.png" alt="" class="employee">
                    <img src="images/Face-2.png" alt="" class="employee">
                    <img src="images/Face-3.png" alt="" class="employee">
                </div>
                <div class="specialists">
                    <p class="fs-medium c-white bold">20+</p>
                    <p class="fs-medium c-blue bold">Specialists</p>
                </div>
            </div>
        </div>
    </div>

</section>

</body>
</html>
