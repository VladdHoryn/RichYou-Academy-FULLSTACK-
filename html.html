<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task-3</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="topbar">
    <div class="topbar-left">
        <button id="menu-toggle" class="menu-btn">☰</button>
        <div class="logo">MyApp</div>
    </div>
    <div class="topbar-right">
        <button id="theme-toggle" class="theme-btn">🌙</button>
        <button id="auth-btn" class="auth-btn">Login</button>
    </div>
</header>

<aside class="sidebar" id="sidebar">
    <ul>
        <li data-section="todo" class="active">ToDo</li>
        <li data-section="analytics">Analytics</li>
        <li data-section="people">People</li>
        <li data-section="products">Products</li>
        <li data-section="settings">Settings</li>
    </ul>
</aside>

<div id="overlay" class="overlay hidden"></div>

<div id="auth-container" class="auth-container hidden">
    <form id="auth-form">
        <h2>Увійдіть</h2>
        <input type="email" id="email" placeholder="User email" required/>
        <input type="password" id="password" placeholder="Password"  minlength="6" required/>
        <button type="submit">Увійти</button>
    </form>
</div>

<main id="app" class="content hidden">
    <section id="todo" class="section active">
        <div class="todo-container">
            <h1>Today</h1>

            <div class="filter-block">
                <button data-filter="all" class="filter-btn active">All</button>
                <button data-filter="completed" class="filter-btn">Completed</button>
                <button data-filter="pending" class="filter-btn">Pending</button>
            </div>

            <div class="columns">
                <ul class="column" id="design">
                    <p class="column-header">DESIGN</p>
                </ul>

                <ul class="column" id="personal">
                    <p class="column-header">PERSONAL</p>
                </ul>

                <ul class="column" id="house">
                    <p class="column-header">HOUSE</p>
                </ul>
            </div>

            <div class="bottom-input">
                <input type="text" placeholder="Write a task..." id="new-title">
                <button id="add-item">Add</button>
            </div>
        </div>
    </section>

    <section id="analytics" class="section hidden">
        <h2>Analytics</h2>

        <div class="tabs">
            <button class="tab-btn active" data-tab="sales-days">Sales by days</button>
            <button class="tab-btn" data-tab="leads-days">Leads by days</button>
            <button class="tab-btn" data-tab="repeat-purchases">Repeat purchases</button>
            <button class="tab-btn" data-tab="revenue">Revenue</button>
            <button class="tab-btn" data-tab="sales-manager">Sales by manager</button>
        </div>

        <div class="chart-container">
            <canvas id="sales-days" class="chart active"></canvas>
            <canvas id="leads-days" class="chart"></canvas>
            <canvas id="repeat-purchases" class="chart"></canvas>
            <canvas id="revenue" class="chart"></canvas>
            <canvas id="sales-manager" class="chart"></canvas>
        </div>
    </section>

    <section id="people" class="section"><h2>People</h2>
    </section>
    <section id="products" class="section"><h2>Products</h2>
    </section>
    <section id="settings" class="section"><h2>Settings</h2>
    </section>
</main>

<script src="auth.js" type="module"></script>
<script src="main.js" type="module"></script>
<script src="todo.js" type="module"></script>
<script src="analytics.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
