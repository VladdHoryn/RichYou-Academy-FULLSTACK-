<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task-3</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="topbar">
    <div class="topbar-left">
        <button id="menu-toggle" class="menu-btn">☰</button>
        <div class="logo">MyApp</div>
    </div>
    <div class="topbar-right">
        <button id="theme-toggle" class="theme-btn">🌙</button>
        <button id="auth-btn" class="auth-btn">Login</button>
    </div>
</header>

<aside class="sidebar" id="sidebar">
    <ul>
        <li data-section="todo" class="active">ToDo</li>
        <li data-section="analytics">Analytics</li>
        <li data-section="people">People</li>
        <li data-section="products">Products</li>
        <li data-section="settings">Settings</li>
    </ul>
</aside>

<div id="overlay" class="overlay hidden"></div>

<div id="auth-container" class="auth-container hidden">
    <form id="auth-form">
        <h2>Увійдіть</h2>
        <input type="email" id="email" placeholder="User email" required/>
        <input type="password" id="password" placeholder="Password" required/>
        <button type="submit">Увійти</button>
    </form>
</div>

<main id="app" class="content hidden">
    <section id="todo" class="section active"><h2>ToDo</h2>
    </section>
    <section id="analytics" class="section"><h2>Analytics</h2>
    </section>
    <section id="people" class="section"><h2>People</h2>
    </section>
    <section id="products" class="section"><h2>Products</h2>
    </section>
    <section id="settings" class="section"><h2>Settings</h2>
    </section>
</main>

<script src="auth.js" type="module"></script>
<script src="main.js" type="module"></script>
</body>
</html>
